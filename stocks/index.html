<!DOCTYPE html>
<html>
	<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>WebOas.is - Stocks</title>
		<link rel="icon" type="image/png" href="/favicon/favicon-32x32.png" sizes="32x32" />
		<link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,600" rel="stylesheet">
		<script type="text/javascript" src="assets/vendor/chart.js/Chart.min.js"></script>
		<style>
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				font-family: 'Roboto', sans-serif;
				background: #1a1d23;
				color: #e8e8e8;
			}
			a { color: #4fc3f7; text-decoration: none; }
			a:hover { text-decoration: underline; }
			header {
				padding: 16px 24px;
				border-bottom: 1px solid #2c2f36;
				display: flex;
				align-items: center;
				justify-content: space-between;
			}
			header .title { font-size: 20px; font-weight: 500; }
			main {
				max-width: 760px;
				margin: 0 auto;
				padding: 32px 20px 60px;
			}
			.search-row {
				display: flex;
				gap: 10px;
				margin-bottom: 28px;
			}
			.search-row input {
				flex: 1;
				padding: 12px 14px;
				font-size: 16px;
				background: #22252c;
				border: 1px solid #383c45;
				border-radius: 6px;
				color: #e8e8e8;
			}
			.search-row input:focus { outline: none; border-color: #0b89c3; }
			.search-row button {
				padding: 12px 22px;
				font-size: 15px;
				background: #0b89c3;
				border: none;
				border-radius: 6px;
				color: #fff;
				cursor: pointer;
			}
			.search-row button:hover { background: #0d9fe0; }
			.hint { color: #8a8f98; font-size: 13px; margin: -18px 0 26px; }
			#status { min-height: 24px; margin-bottom: 16px; color: #8a8f98; }
			#status.error { color: #ef5350; }
			#result { display: none; }
			.quote-head {
				display: flex;
				align-items: baseline;
				justify-content: space-between;
				flex-wrap: wrap;
				gap: 8px;
				margin-bottom: 4px;
			}
			.quote-head h1 { margin: 0; font-size: 22px; font-weight: 500; }
			.quote-head .symbol { color: #8a8f98; font-size: 15px; margin-left: 8px; }
			.price-row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
			.price-row .price { font-size: 36px; font-weight: 300; }
			.price-row .change { font-size: 16px; }
			.change.up { color: #4caf50; }
			.change.down { color: #ef5350; }
			.change.flat { color: #8a8f98; }
			canvas#chart { width: 100%; max-height: 320px; margin-bottom: 28px; }
			.range-buttons { display: flex; gap: 8px; margin: -18px 0 24px; }
			.range-buttons button {
				padding: 6px 14px;
				font-size: 13px;
				background: #22252c;
				border: 1px solid #383c45;
				border-radius: 4px;
				color: #b0b4bb;
				cursor: pointer;
			}
			.range-buttons button.active { background: #0b89c3; border-color: #0b89c3; color: #fff; }
			table.stats { width: 100%; border-collapse: collapse; }
			table.stats td { padding: 10px 4px; border-bottom: 1px solid #2c2f36; font-size: 14px; }
			table.stats td:first-child { color: #8a8f98; width: 50%; }
			table.stats td:last-child { text-align: right; }
			.back-link { display: inline-block; margin-top: 20px; }
		</style>
	</head>
	<body>
		<header>
			<div class="title"><a href="/">WebOasis</a> / Stocks</div>
		</header>
		<main>
			<div class="search-row">
				<input type="text" id="symbol-input" placeholder="Ticker symbol, e.g. AAPL, MSFT, TSLA" autocomplete="off">
				<button id="search-btn">Search</button>
			</div>
			<div class="hint">Live quote and 3-month price history via Yahoo Finance.</div>
			<div id="status"></div>
			<div id="result">
				<div class="quote-head">
					<h1 id="q-name"></h1>
					<span class="symbol" id="q-symbol"></span>
				</div>
				<div class="price-row">
					<span class="price" id="q-price"></span>
					<span class="change" id="q-change"></span>
				</div>
				<div class="range-buttons">
					<button data-range="1mo" data-interval="1d">1M</button>
					<button data-range="3mo" data-interval="1d" class="active">3M</button>
					<button data-range="1y" data-interval="1wk">1Y</button>
					<button data-range="5y" data-interval="1mo">5Y</button>
				</div>
				<canvas id="chart"></canvas>
				<table class="stats">
					<tr><td>Previous Close</td><td id="s-prevclose">—</td></tr>
					<tr><td>Day Range</td><td id="s-dayrange">—</td></tr>
					<tr><td>52 Week Range</td><td id="s-yearrange">—</td></tr>
					<tr><td>Volume</td><td id="s-volume">—</td></tr>
					<tr><td>Currency</td><td id="s-currency">—</td></tr>
					<tr><td>Exchange</td><td id="s-exchange">—</td></tr>
				</table>
			</div>
			<a class="back-link" href="/">&larr; Back to WebOasis</a>
		</main>
		<script src="app.js"></script>
	</body>
</html>
