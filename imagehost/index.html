<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
		<title>WebOas.is - Image Host</title>
		<link rel="icon" type="image/png" href="../favicon/favicon-32x32.png" sizes="32x32" />
		<link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,600" rel="stylesheet">
		<style>
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100vh;
				font-family: 'Roboto', sans-serif;
				background: #1a1d23;
				color: #e8e8e8;
			}
			a { color: #4fc3f7; text-decoration: none; }
			a:hover { text-decoration: underline; }
			header {
				padding: 16px 24px;
				border-bottom: 1px solid #2c2f36;
			}
			header .title { font-size: 20px; font-weight: 500; }
			main {
				max-width: 560px;
				margin: 40px auto;
				padding: 0 20px;
			}
			.card {
				background: #22252c;
				border: 1px solid #2c2f36;
				border-radius: 8px;
				padding: 24px;
			}
			.dropzone {
				border: 2px dashed #383c45;
				border-radius: 6px;
				padding: 30px;
				text-align: center;
				color: #8a8f98;
				cursor: pointer;
			}
			.dropzone.dragover { border-color: #0b89c3; color: #e8e8e8; }
			.dropzone input { display: none; }
			.preview { margin-top: 16px; text-align: center; display: none; }
			.preview.visible { display: block; }
			.preview img { max-width: 100%; max-height: 300px; border-radius: 6px; }
			button.primary {
				margin-top: 14px;
				background: #0b89c3;
				border: none;
				border-radius: 4px;
				color: #fff;
				padding: 10px 18px;
				font-size: 14px;
				cursor: pointer;
			}
			button.primary:hover { background: #0d9fe0; }
			button.primary:disabled { opacity: .6; cursor: default; }
			.result {
				margin-top: 20px;
				padding: 14px;
				background: #1a1d23;
				border: 1px solid #2c2f36;
				border-radius: 6px;
				display: none;
			}
			.result.visible { display: block; }
			.result input {
				width: 100%;
				background: transparent;
				border: none;
				color: #4fc3f7;
				font-size: 15px;
				padding: 4px 0;
			}
			.error { color: #f16b6b; font-size: 13px; margin-top: 10px; display: none; }
			.error.visible { display: block; }
			.back-link { display: inline-block; margin-bottom: 18px; font-size: 14px; }
			.hint { font-size: 12px; color: #8a8f98; margin-top: 10px; }
		</style>
	</head>
	<body>
		<header>
			<div class="title"><a href="../">WebOasis</a> / Image Host</div>
		</header>
		<main>
			<a class="back-link" href="../">&larr; Back to WebOasis</a>
			<div class="card">
				<label class="dropzone" id="dropzone" for="file-input">
					<span id="dropzone-text">Click to choose an image, or drag one here</span>
					<input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp" />
				</label>
				<div class="preview" id="preview">
					<img id="preview-img" alt="Selected image preview" />
				</div>
				<div>
					<button class="primary" id="upload-btn" disabled>Upload</button>
				</div>
				<div class="hint">JPEG, PNG, GIF, or WebP — 8MB max</div>
				<div class="error" id="error-box"></div>
				<div class="result" id="result-box">
					<label>Image link</label>
					<input type="text" id="result-url" readonly />
					<button class="primary" id="copy-btn" style="margin-top:10px">Copy</button>
				</div>
			</div>
		</main>
		<script src="../js/site-services-config.js"></script>
		<script src="imagehost.js"></script>
	</body>
</html>
