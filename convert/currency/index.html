<html>
    <head>
        <title>WebOas.is - Currency Converter</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="A currency conversion page that helps you to convert different amounts of money between currencies.">
		<link rel="icon" type="image/png" href="favicon.png">
        <!--CSS Files-->
        <link href="assets/css/bootstrap.min.css" rel="stylesheet">
        <link href="assets/css/bootstrap-select.min.css" rel="stylesheet">
        <link href="assets/css/fontawesome.min.css" rel="stylesheet">
        <link href='assets/css/style.css' rel='stylesheet' type='text/css'>
        <!--JS Files-->
        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/popper.min.js"></script>
        <script src="assets/js/bootstrap.min.js"></script>
        <script src="assets/js/bootstrap-select.min.js"></script>
        <script src="assets/js/currencies.js"></script>
        <script src="assets/js/script.js"></script>
    </head>
    <body>
        <div class="main-content">
            <section class="header">
                <div class="container">
                    <div class="converter">
                        <h1>WebOasis Currency Converter</h1>
                        <p class="rates-note" id="ratesNote">Loading live exchange rates&hellip;</p>
                        <div class="convert-box">
                            <div class="row">
                                <div class="col-md-5 col-sm-12 col-xs-12">
                                    <label class="label">From</label>
                                    <div class="select">
                                        <div class="input-wrap">
                                            <input type="text" class="form-control" value="1" name="finpt" id="finpt" pattern="/^-?\d*[.,]?\d{0,2}$/">
                                        </div>
                                        <select id="fromCurr" name="fromCurr" data-show-subtext="true" class="selectpicker bs-select form-control" data-live-search="true" data-size="8"></select>
                                    </div>
                                </div>
                                <div class="col-md-2 col-sm-12 col-xs-12">
                                    <label class="label"><br /></label>
                                    <div class="select text-center">
                                        <button class="exchange-btn"></button>
                                    </div>
                                </div>
                                <div class="col-md-5 col-sm-12 col-xs-12">
                                    <label class="label">To</label>
                                    <div class="select">
                                        <div class="input-wrap">
                                            <input type="text" class="form-control" name="tinpt" id="tinpt" pattern="/^-?\d*[.,]?\d{0,2}$/">
                                        </div>
                                        <select id="toCurr" name="toCurr" data-show-subtext="true" class="selectpicker bs-select form-control" data-live-search="true" data-size="8"></select>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <section class="list-currencies">
            <div class="container">
                <h2 class="text-center">World currencies</h2>
                <div class="row">
                    <div class="col-md-6">
                        <div class="section-currencies-table">
                            <div class="table-responsive">
                                <table class="table table-striped custab table-hover">
                                    <thead>
                                        <tr>
                                            <th class="caption-col">Flag</th>
                                            <th class="caption-col">Code</th>
                                            <th class="caption-col">Currency name</th>
                                            <th class="caption-col">Country</th>
                                        </tr>
                                    </thead>
                                    <tbody id="currencyTableLeft"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="section-currencies-table">
                            <div class="table-responsive">
                                <table class="table table-striped custab table-hover">
                                    <thead>
                                        <tr>
                                            <th class="caption-col">Flag</th>
                                            <th class="caption-col">Code</th>
                                            <th class="caption-col">Currency name</th>
                                            <th class="caption-col">Country</th>
                                        </tr>
                                    </thead>
                                    <tbody id="currencyTableRight"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <footer>
            <div class="container">
                <div class="footer text-center">
                    <p class="copyright">Copyright &copy; <span id="copyrightYear"></span> WebOasis Currency Converter</p>
                </div>
            </div>
        </footer>
    </body>
</html>
